[package]
name = "qwen-serve"
version = "0.1.0"
edition = "2021"
description = "Self-contained Qwen 3.5 0.8B HTTP server: Axum + tokenizers + ONNX Runtime (statically linked)."
license = "Apache-2.0"

[[bin]]
name = "qwen-serve"
path = "src/main.rs"

[dependencies]
# ONNX Runtime. Features are additive in Cargo, so ort's API level is
# controlled by OUR features, not by listing features here: the default
# build uses api-27 (matches the 1.28 prebuilts ort-sys downloads), and
# --no-default-features --features mac-x64-legacy rebuilds against api-22
# for the last Intel dylib (see [features] and ci.yml).
ort = { version = "2.0.0-rc.10", default-features = false, features = ["half"] }
# HF tokenizers with fancy-regex (pure Rust) instead of onig (onig_sys
# bundles+compiles C code — breaks cross builds; our tokenizer.json needs
# no regex anyway: Metaspace + BPE only). Drops: progressbar, esaxx_fast.
tokenizers = { version = "0.22", default-features = false, features = ["fancy-regex"] }
# HTTP server + JSON
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
# preserve_order: the option order is part of the prompt. Without it the
# object keys sort alphabetically, so the same question with the same options
# can answer differently from the upstream implementation, which keeps the
# order the caller sent.
serde_json = { version = "1", features = ["preserve_order"] }
anyhow = "1"
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# CLI args
clap = { version = "4", features = ["derive"] }

[features]
# The normal build. Mirrors ort's own defaults minus the download/tls bits
# we do not need, pinned to api-27 (matches the 1.28 prebuilts ort-sys
# downloads for every target except x86_64-apple-darwin).
default = ["ort/std", "ort/ndarray", "ort/tracing", "ort/download-binaries", "ort/tls-native", "ort/copy-dylibs", "ort/api-27"]
# mac-x64: links dynamically against modern onnxruntime from Homebrew (API 27+)
mac-x64 = ["ort/std", "ort/ndarray", "ort/tracing", "ort/copy-dylibs", "ort/api-27", "ort/tls-native"]
mac-x64-legacy = ["ort/std", "ort/ndarray", "ort/tracing", "ort/copy-dylibs", "ort/api-23", "ort/tls-native"]
# Acceleration EPs (opt-in). The default build is CPU-only so numerics stay
# bit-identical to the pinned reference outputs. Enable one or more of these
# at BUILD time and pick one at RUN time with --ep auto|dml|coreml|nnapi|qnn.
# ort-sys features are pure markers: the registration symbols come from the
# onnxruntime build itself and an unavailable EP fails registration at
# session creation (silent CPU fallback for --ep auto, hard error for an
# explicit --ep name).
ep-directml = ["ort/directml"]
ep-coreml = ["ort/coreml"]
ep-nnapi = ["ort/nnapi"]
ep-qnn = ["ort/qnn"]

[build-dependencies]
cc = "1"
# Fast base64 not needed; keep minimal.

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
